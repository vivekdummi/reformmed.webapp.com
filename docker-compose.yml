services:

  postgres:
    image: postgres:16-alpine
    container_name: reformmed_postgres
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
      TZ:                Asia/Kolkata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./server
    container_name: reformmed_api
    command: python main.py
    environment:
      POSTGRES_HOST:     reformmed_postgres
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_PORT:     5432
      API_SECRET:        ${API_SECRET}
      API_HOST:          0.0.0.0
      API_PORT:          8000
      TZ:                Asia/Kolkata
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  webapp:
    build:
      context: .
    container_name: reformmed_webapp
    command: python app.py
    environment:
      POSTGRES_HOST:     reformmed_postgres
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
      FLASK_SECRET:      ${FLASK_SECRET}
      FLASK_DEBUG:       "0"
      GMAIL_USER:        ${GMAIL_USER}
      GMAIL_APP_PASS:    ${GMAIL_APP_PASS}
      SMTP_HOST:         smtp.gmail.com
      SMTP_PORT:         "465"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      TZ:                Asia/Kolkata
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  checker:
    build:
      context: .
    container_name: reformmed_checker
    command: python offline_checker.py
    environment:
      POSTGRES_HOST:       reformmed_postgres
      POSTGRES_USER:       ${POSTGRES_USER}
      POSTGRES_PASSWORD:   ${POSTGRES_PASSWORD}
      POSTGRES_DB:         ${POSTGRES_DB}
      GMAIL_USER:          ${GMAIL_USER}
      GMAIL_APP_PASS:      ${GMAIL_APP_PASS}
      SMTP_HOST:           smtp.gmail.com
      SMTP_PORT:           "465"
      OFFLINE_AFTER_SECS:  "60"
      CHECK_INTERVAL_SECS: "15"
      TZ:                  Asia/Kolkata
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: