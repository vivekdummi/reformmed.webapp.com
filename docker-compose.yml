services:

  api:
    build:
      context: ./server
    container_name: reformmed_api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2
    network_mode: "host"
    environment:
      POSTGRES_HOST:     ${POSTGRES_HOST}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_PORT:     ${POSTGRES_PORT:-5432}
      API_SECRET:        ${API_SECRET}
      API_HOST:          0.0.0.0
      API_PORT:          8000
      TZ:                Asia/Kolkata
    restart: unless-stopped

  webapp:
    build:
      context: .
    container_name: reformmed_webapp
    # Production WSGI server instead of the Werkzeug dev server. One worker so
    # the in-memory login rate limiter is shared; threads handle concurrency.
    command: gunicorn -w 1 --threads 8 -b 0.0.0.0:5000 --timeout 90 "app:create_app()"
    network_mode: "host"
    environment:
      POSTGRES_HOST:     ${POSTGRES_HOST}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_PORT:     ${POSTGRES_PORT:-5432}
      FLASK_SECRET:      ${FLASK_SECRET}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY}
      ALERT_TO:          ${ALERT_TO}
      FLASK_DEBUG:       "0"
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-1}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      GMAIL_USER:        ${GMAIL_USER}
      GMAIL_APP_PASS:    ${GMAIL_APP_PASS}
      SMTP_HOST:         smtp.gmail.com
      SMTP_PORT:         "465"
      GEMINI_MODEL:      ${GEMINI_MODEL:-gemini-2.0-flash}
      GEMINI_API_KEY:    ${GEMINI_API_KEY}
      GOOGLE_CLIENT_ID:     ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      TZ:                Asia/Kolkata
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  checker:
    build:
      context: .
    container_name: reformmed_checker
    command: python offline_checker.py
    network_mode: "host"
    environment:
      POSTGRES_HOST:       ${POSTGRES_HOST}
      POSTGRES_USER:       ${POSTGRES_USER}
      POSTGRES_PASSWORD:   ${POSTGRES_PASSWORD}
      POSTGRES_DB:         ${POSTGRES_DB}
      POSTGRES_PORT:       ${POSTGRES_PORT:-5432}
      GMAIL_USER:          ${GMAIL_USER}
      GMAIL_APP_PASS:      ${GMAIL_APP_PASS}
      # Needed to decrypt SMTP credentials saved in Settings, and as the
      # fallback recipient list when a machine has no recipients of its own.
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY}
      ALERT_TO:            ${ALERT_TO}
      SMTP_HOST:           smtp.gmail.com
      SMTP_PORT:           "465"
      OFFLINE_AFTER_SECS:  "60"
      CHECK_INTERVAL_SECS: "15"
      TZ:                  Asia/Kolkata
    restart: unless-stopped