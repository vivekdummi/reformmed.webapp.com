name: CI/CD — Test & Deploy

on:
  push:
    branches:
      - feature/main-prod-7
  pull_request:
    branches:
      - feature/main-prod-7

jobs:
  # ── JOB 1: CI Tests ──────────────────────────────────────────────────────
  test:
    name: Syntax & Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install flask flask-login psycopg2-binary werkzeug python-dotenv

      - name: Check Python syntax
        run: |
          echo "Checking Python syntax..."
          python3 -m py_compile app.py db.py models.py alert_sender.py
          for f in blueprints/*.py; do
            python3 -m py_compile "$f" && echo "  OK  $f" || exit 1
          done
          echo "All Python files OK"

      - name: Check Jinja2 templates for false-positive comment tags
        run: |
          echo "Checking templates..."
          if grep -rn '{#[a-zA-Z]' templates/; then
            echo "ERROR: Jinja2 false-positive comment tags found!"
            exit 1
          fi
          echo "All templates OK"

      - name: Check no hardcoded secrets
        run: |
          echo "Checking for hardcoded secrets..."
          if grep -rn "sk-ant-api" blueprints/ templates/ *.py 2>/dev/null; then
            echo "ERROR: Hardcoded Anthropic API key found!"
            exit 1
          fi
          echo "No hardcoded secrets found"

      - name: Verify required files exist
        run: |
          echo "Checking required files..."
          files=(
            "app.py" "db.py" "models.py" "requirements.txt"
            "docker-compose.yml" "Dockerfile"
            "blueprints/__init__.py" "blueprints/auth.py"
            "blueprints/home.py" "blueprints/api.py"
            "blueprints/alerts.py" "blueprints/settings.py"
            "blueprints/review.py" "blueprints/terminal.py"
            "blueprints/dvr.py" "blueprints/dbmonitor.py"
            "blueprints/servers.py" "blueprints/users.py"
            "templates/base.html" "templates/home.html"
            "templates/review.html" "templates/terminal.html"
            "templates/settings.html"
            "server/main.py" "server/Dockerfile" "server/requirements.txt"
          )
          all_ok=true
          for f in "${files[@]}"; do
            if [ -f "$f" ]; then
              echo "  OK  $f"
            else
              echo "  MISSING  $f"
              all_ok=false
            fi
          done
          $all_ok || exit 1

  # ── JOB 2: Deploy (push only, not PR) ───────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/main-prod-7'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "=== Starting deployment ==="
            cd ~/reformmed.webapp.com

            cp .env /tmp/.env.backup
            git fetch origin
            git checkout feature/main-prod-7
            git pull origin feature/main-prod-7
            cp /tmp/.env.backup .env

            docker compose up -d --build
            sleep 8

            docker compose ps
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/login)
            echo "=== Webapp health check: HTTP $status ==="
            [ "$status" = "200" ] || exit 1
            echo "=== Deployment successful ==="