name: CI/CD — REFORMMED Monitor

on:
  push:
    branches:
      - 'feature/main-prod-*'
      - main
  pull_request:
    branches:
      - 'feature/main-prod-*'
      - main

jobs:

  # ════════════════════════════════════════════════════════════
  # JOB 1 — Python Syntax Check
  # ════════════════════════════════════════════════════════════
  syntax-check:
    name: 🐍 Python Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check root Python files
        run: |
          for f in app.py db.py models.py alert_sender.py offline_checker.py; do
            [ -f "$f" ] && python3 -m py_compile "$f" && echo "✅ $f" || { echo "❌ $f"; exit 1; }
          done

      - name: Check blueprints
        run: |
          for f in blueprints/*.py; do
            python3 -m py_compile "$f" && echo "✅ $f" || { echo "❌ $f"; exit 1; }
          done

      - name: Check server files
        run: |
          for f in server/*.py; do
            [ -f "$f" ] && python3 -m py_compile "$f" && echo "✅ $f" || { echo "❌ $f"; exit 1; }
          done

  # ════════════════════════════════════════════════════════════
  # JOB 2 — Template Check
  # ════════════════════════════════════════════════════════════
  template-check:
    name: 🧩 Jinja2 Templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check false-positive comment tags
        run: |
          if grep -rn '{#[a-zA-Z]' templates/; then
            echo "❌ Jinja2 false-positive comment tags found!"
            exit 1
          fi
          echo "✅ No Jinja2 issues"

      - name: Check required templates exist
        run: |
          required=(
            "templates/base.html" "templates/home.html"
            "templates/login.html" "templates/alerts.html"
            "templates/settings.html" "templates/review.html"
            "templates/terminal.html" "templates/users.html"
            "templates/user_edit.html" "templates/servers.html"
          )
          for f in "${required[@]}"; do
            [ -f "$f" ] && echo "✅ $f" || { echo "❌ MISSING: $f"; exit 1; }
          done

  # ════════════════════════════════════════════════════════════
  # JOB 3 — Security Check
  # ════════════════════════════════════════════════════════════
  security-check:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security tools
        run: pip install pip-audit bandit safety -q

      - name: CVE scan (pip-audit)
        run: |
          pip-audit -r requirements.txt --ignore-vuln GHSA-jfh8-c2jp-j6f7 || true
          echo "✅ pip-audit complete"

      - name: Code vulnerabilities (bandit)
        run: |
          bandit -r blueprints/ app.py db.py models.py -ll -q || true
          echo "✅ bandit scan complete"

      - name: Known advisories (safety)
        run: |
          safety check -r requirements.txt --continue-on-error || true
          echo "✅ safety check complete"

      - name: Check no hardcoded secrets
        run: |
          if grep -rn "sk-ant-api" blueprints/ templates/ *.py server/ 2>/dev/null; then
            echo "❌ Hardcoded Anthropic API key found!"
            exit 1
          fi
          echo "✅ No hardcoded secrets"

      - name: Check .env not tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "❌ .env is tracked by git!"
            exit 1
          fi
          echo "✅ .env not tracked"

  # ════════════════════════════════════════════════════════════
  # JOB 4 — File Structure Check
  # ════════════════════════════════════════════════════════════
  file-check:
    name: 📁 File Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required blueprints
        run: |
          files=(
            "blueprints/__init__.py" "blueprints/auth.py"
            "blueprints/home.py" "blueprints/api.py"
            "blueprints/alerts.py" "blueprints/settings.py"
            "blueprints/review.py" "blueprints/terminal.py"
            "blueprints/dvr.py" "blueprints/dbmonitor.py"
            "blueprints/servers.py" "blueprints/users.py"
          )
          for f in "${files[@]}"; do
            [ -f "$f" ] && echo "✅ $f" || { echo "❌ MISSING: $f"; exit 1; }
          done

      - name: Check server files
        run: |
          files=(
            "server/main.py" "server/Dockerfile"
            "server/requirements.txt" "server/offline_checker.py"
            "server/dashboard_manager.py"
          )
          for f in "${files[@]}"; do
            [ -f "$f" ] && echo "✅ $f" || { echo "❌ MISSING: $f"; exit 1; }
          done

      - name: Check docker-compose services
        run: |
          for s in postgres api webapp checker; do
            grep -q "container_name: reformmed_$s" docker-compose.yml \
              && echo "✅ service: $s" \
              || { echo "❌ MISSING service: $s"; exit 1; }
          done

  # ════════════════════════════════════════════════════════════
  # JOB 5 — Dependencies Check
  # ════════════════════════════════════════════════════════════
  deps-check:
    name: 📦 Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check webapp requirements
        run: |
          pip install -r requirements.txt -q
          echo "✅ Webapp requirements OK"

      - name: Check server requirements
        run: |
          pip install -r server/requirements.txt -q
          echo "✅ Server requirements OK"

      - name: Check required packages present
        run: |
          for p in flask flask-login psycopg2 werkzeug; do
            grep -qi "$p" requirements.txt \
              && echo "✅ $p" \
              || { echo "❌ MISSING: $p"; exit 1; }
          done

  # ════════════════════════════════════════════════════════════
  # JOB 6 — Stop containers
  # ════════════════════════════════════════════════════════════
  stop-containers:
    name: 🛑 Stop containers
    runs-on: ubuntu-latest
    needs: [syntax-check, template-check, security-check, file-check, deps-check]
    if: github.event_name == 'push'
    environment:
      name: production
      url: https://infra.reformmed.tech
    steps:
      - name: Stop & save current commit
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd ~/reformmed.webapp.com
            # Save current working commit for rollback
            git rev-parse HEAD > /tmp/rollback_commit.txt
            echo "💾 Saved rollback point: $(cat /tmp/rollback_commit.txt)"
            # Stop webapp and checker (keep DB running)
            docker compose stop webapp checker api
            echo "✅ Containers stopped"

  # ════════════════════════════════════════════════════════════
  # JOB 7 — Git pull latest code
  # ════════════════════════════════════════════════════════════
  git-pull:
    name: 📥 Git pull latest code
    runs-on: ubuntu-latest
    needs: stop-containers
    steps:
      - name: Pull latest code
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd ~/reformmed.webapp.com
            cp .env /tmp/.env.backup
            git fetch origin
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}
            cp /tmp/.env.backup .env
            echo "✅ Code updated to: $(git log -1 --format='%h — %s')"

  # ════════════════════════════════════════════════════════════
  # JOB 8 — Docker build & start
  # ════════════════════════════════════════════════════════════
  docker-build:
    name: 🐳 Docker build & start
    runs-on: ubuntu-latest
    needs: git-pull
    steps:
      - name: Build and start containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd ~/reformmed.webapp.com
            echo "🐳 Building Docker images..."
            docker compose up -d --build
            sleep 10
            docker compose ps
            echo "✅ Containers started"

  # ════════════════════════════════════════════════════════════
  # JOB 9 — Run migrations
  # ════════════════════════════════════════════════════════════
  run-migrations:
    name: 🗄️ Run migrations
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Run DB migrations
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            echo "🗄️ Running DB migrations..."
            docker exec reformmed_webapp python3 -c "
            from db import init_db
            init_db()
            print('✅ DB migrations complete')
            "

  # ════════════════════════════════════════════════════════════
  # JOB 10 — Health check
  # ════════════════════════════════════════════════════════════
  health-check:
    name: ❤️ Health check
    runs-on: ubuntu-latest
    needs: run-migrations
    steps:
      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            echo "── Container Status ──"
            docker compose -f ~/reformmed.webapp.com/docker-compose.yml ps

            echo "── Webapp health check ──"
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/login)
            echo "  HTTP Status: $status"

            echo "── DB health check ──"
            docker exec reformmed_postgres pg_isready -U reformmed -d monitor_machine \
              && echo "  ✅ PostgreSQL healthy" \
              || echo "  ⚠️ PostgreSQL check failed"

            if [ "$status" = "200" ]; then
              echo ""
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "  ✅ DEPLOYMENT SUCCESSFUL"
              echo "  🌐 https://infra.reformmed.tech"
              echo "  📅 $(date '+%Y-%m-%d %H:%M:%S UTC')"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            else
              echo "❌ Health check failed — HTTP $status"
              docker compose -f ~/reformmed.webapp.com/docker-compose.yml logs webapp --tail=20
              exit 1
            fi

  # ════════════════════════════════════════════════════════════
  # JOB 11 — Rollback on failure
  # ════════════════════════════════════════════════════════════
  rollback:
    name: ⏪ Rollback to previous version
    runs-on: ubuntu-latest
    needs:
      - stop-containers
      - git-pull
      - docker-build
      - run-migrations
      - health-check
    if: failure()
    steps:
      - name: Rollback to last working commit
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            echo "⏪ ROLLBACK INITIATED"
            cd ~/reformmed.webapp.com

            # Get saved rollback commit
            if [ -f /tmp/rollback_commit.txt ]; then
              ROLLBACK_COMMIT=$(cat /tmp/rollback_commit.txt)
              echo "  Rolling back to: $ROLLBACK_COMMIT"

              # Restore .env
              cp /tmp/.env.backup .env 2>/dev/null || true

              # Checkout last working commit
              git checkout $ROLLBACK_COMMIT

              # Rebuild with old code
              docker compose up -d --build
              sleep 10

              # Verify rollback worked
              status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/login)
              if [ "$status" = "200" ]; then
                echo ""
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                echo "  ✅ ROLLBACK SUCCESSFUL"
                echo "  App restored to: $ROLLBACK_COMMIT"
                echo "  🌐 https://infra.reformmed.tech is UP"
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              else
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                echo "  ❌ ROLLBACK ALSO FAILED — HTTP $status"
                echo "  Manual intervention required!"
                echo "  SSH: ssh ubuntu@${{ secrets.SERVER_HOST }}"
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                exit 1
              fi
            else
              echo "❌ No rollback point found!"
              echo "  Starting containers with current code..."
              docker compose -f ~/reformmed.webapp.com/docker-compose.yml up -d
            fi