{% extends "_auth_base.html" %}
{% block title %}Sign in — Reformmed INFRA Monitor{% endblock %}

{% block head %}
  <h1>Sign in</h1>
  <p>to continue to Reformmed INFRA Monitor</p>
{% endblock %}

{% block body %}
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <input type="text" id="username" name="username" placeholder=" " autocomplete="username" required autofocus>
      <label for="username">Username or email</label>
    </div>
    <div class="field">
      <input type="password" id="password" name="password" placeholder=" " autocomplete="current-password" required>
      <label for="password">Password</label>
    </div>
    <a href="{{ url_for('auth.forgot_password') }}" class="link">Forgot password?</a>
    <div class="actions">
      <span></span>
      <button type="submit" class="btn btn-primary">Next</button>
    </div>
  </form>

  {% if google_sso_enabled %}
  <div class="divider">or</div>
  <a href="{{ url_for('auth.google_login') }}" class="btn btn-outline">
    <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.5 29.3 35.5 24 35.5c-6.4 0-11.5-5.1-11.5-11.5S17.6 12.5 24 12.5c2.9 0 5.6 1.1 7.6 2.9l5.7-5.7C33.9 6.5 29.2 4.5 24 4.5 13.2 4.5 4.5 13.2 4.5 24S13.2 43.5 24 43.5 43.5 34.8 43.5 24c0-1.2-.1-2.4-.3-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.6 18.9 12.5 24 12.5c2.9 0 5.6 1.1 7.6 2.9l5.7-5.7C33.9 6.5 29.2 4.5 24 4.5c-7.7 0-14.4 4.4-17.7 10.2z"/><path fill="#4CAF50" d="M24 43.5c5.1 0 9.8-2 13.3-5.2l-6.1-5.2c-2 1.5-4.5 2.4-7.2 2.4-5.3 0-9.7-3.5-11.3-8.3l-6.5 5c3.3 6.5 10 11.3 17.8 11.3z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.7l6.1 5.2c-.4.4 6.7-4.9 6.7-14.9 0-1.2-.1-2.4-.3-3.5z"/></svg>
    Sign in with Google
  </a>
  {% endif %}
{% endblock %}
