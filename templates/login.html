<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — REFORMMED Monitor</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0f14; --bg2: #141720; --bg3: #1c2030;
      --border: #252a3a; --accent: #00d4ff; --text: #e2e8f0;
      --text-muted: #64748b; --red: #ef4444; --green: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 600px 400px at 20% 50%, rgba(0,212,255,0.04) 0%, transparent 70%),
        radial-gradient(ellipse 500px 400px at 80% 50%, rgba(124,58,237,0.04) 0%, transparent 70%);
      pointer-events: none;
    }
    .login-wrap {
      width: 400px;
      max-width: 95vw;
    }
    .brand-area {
      text-align: center;
      margin-bottom: 36px;
    }
    .brand-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .brand-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .login-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
    }
    .login-card h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .login-card .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 28px;
    }
    .form-group { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 11px 14px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,212,255,0.08);
    }
    .btn-login {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #0d0f14;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: background 0.15s;
      margin-top: 8px;
      font-family: inherit;
    }
    .btn-login:hover { background: #00b8d9; }
    .alert-danger {
      background: rgba(239,68,68,.12);
      border: 1px solid rgba(239,68,68,.3);
      color: var(--red);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
    }
    .footer-note {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 20px;
    }
    .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--green); margin-right: 4px; box-shadow: 0 0 6px var(--green); }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="brand-area">
      <div class="brand-name">REFORMMED</div>
      <div class="brand-sub">Server Monitor Dashboard</div>
    </div>
    <div class="login-card">
      <h2>Sign in</h2>
      <p class="subtitle">Enter your credentials to continue</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert-danger">{{ message }}</div>
        {% endfor %}
      {% endwith %}

      <form method="POST">
        <div class="form-group">
          <label>Username</label>
          <input type="text" name="username" placeholder="admin" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-login">Sign in →</button>
      </form>
    </div>
    <div class="footer-note">
      <span class="dot"></span> REFORMMED Monitor v2
    </div>
  </div>
</body>
</html>
