<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — REFORMMED Monitor</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root, [data-theme="dark"] {
      --bg: #0d0f14; --bg2: #141720; --bg3: #1c2030;
      --border: #252a3a; --accent: #00d4ff; --text: #e2e8f0;
      --text-muted: #64748b; --red: #ef4444; --green: #22c55e;
    }
    [data-theme="light"] {
      --bg: #f0f2f7; --bg2: #ffffff; --bg3: #e8eaf0;
      --border: #d1d5e0; --accent: #0284c7; --text: #0f172a;
      --text-muted: #64748b; --red: #dc2626; --green: #16a34a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      transition: background .2s, color .2s;
    }
    #themeBtn {
      position: fixed; top: 18px; right: 18px;
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--bg2); border: 1px solid var(--border);
      color: var(--text); font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .login-wrap { width: 400px; max-width: 95vw; }
    .brand-area { text-align: center; margin-bottom: 36px; }
    .brand-name {
      font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700;
      color: var(--accent); letter-spacing: 3px; text-transform: uppercase;
    }
    .brand-sub { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
    .login-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 32px; }
    .login-card h2 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .login-card .subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 28px; }
    .form-group { margin-bottom: 16px; }
    label {
      display: block; font-size: 11px; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px;
    }
    input {
      width: 100%; padding: 11px 14px; background: var(--bg3); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 14px; font-family: inherit;
      outline: none; transition: border-color 0.15s;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,212,255,0.08); }
    .btn-login {
      width: 100%; padding: 12px; background: var(--accent); color: #0d0f14; border: none;
      border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer;
      letter-spacing: 0.5px; transition: background 0.15s; margin-top: 8px; font-family: inherit;
    }
    .btn-login:hover { background: #00b8d9; }
    .alert-danger {
      background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.3); color: var(--red);
      padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px;
    }
    .alert-success {
      background: rgba(34,197,94,.12); border: 1px solid rgba(34,197,94,.3); color: var(--green);
      padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px;
    }
    .footer-note { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 20px; }
    .footer-note a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <button id="themeBtn" onclick="toggleTheme()" title="Toggle theme">🌙</button>
  <div class="login-wrap">
    <div class="brand-area">
      <div class="brand-name">REFORMMED</div>
      <div class="brand-sub">Server Monitor Dashboard</div>
    </div>
    <div class="login-card">
      <h2>Reset password</h2>
      <p class="subtitle">Enter the code we emailed you, plus your new password.</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert-{{ 'success' if category == 'success' else 'danger' }}">{{ message }}</div>
        {% endfor %}
      {% endwith %}

      <form method="POST">
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" value="{{ email }}" placeholder="you@reformmed.com" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label>6-digit code</label>
          <input type="text" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
                 placeholder="000000" autocomplete="one-time-code" required
                 style="letter-spacing:6px;text-align:center;font-family:'JetBrains Mono',monospace;">
        </div>
        <div class="form-group">
          <label>New password</label>
          <input type="password" name="password" placeholder="At least 8 characters" autocomplete="new-password" required minlength="8">
        </div>
        <div class="form-group">
          <label>Confirm new password</label>
          <input type="password" name="confirm" placeholder="Repeat password" autocomplete="new-password" required minlength="8">
        </div>
        <button type="submit" class="btn-login">Reset Password →</button>
      </form>
    </div>
    <div class="footer-note">
      <a href="{{ url_for('auth.forgot_password') }}">Request a new code</a> ·
      <a href="{{ url_for('auth.login') }}">Back to login</a>
    </div>
  </div>
  <script>
    var _dark = (localStorage.getItem('rmTheme') || 'dark') === 'dark';
    function applyTheme() {
      document.documentElement.setAttribute('data-theme', _dark ? 'dark' : 'light');
      document.getElementById('themeBtn').textContent = _dark ? '🌙' : '☀️';
    }
    function toggleTheme() {
      _dark = !_dark;
      localStorage.setItem('rmTheme', _dark ? 'dark' : 'light');
      applyTheme();
    }
    applyTheme();
  </script>
</body>
</html>
