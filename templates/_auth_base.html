<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}Sign in — Reformmed INFRA Monitor{% endblock %}</title>
  <script>
    (function(){
      var t = null;
      try { t = localStorage.getItem('rmTheme'); } catch(e) {}
      if (t !== 'light' && t !== 'dark') {
        t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
  <style>
    /* Same tokens as base.html so sign-in pages match the app in both themes. */
    :root,[data-theme="dark"]{
      color-scheme:dark;
      --bg:#0a1020;--card:#101a2e;--field:#101a2e;--border:#34446a;--divider:#1f2c45;
      --text:#e7eef8;--muted:#93a4bf;--accent:#38b0f8;--on-accent:#03223a;--accent-soft:rgba(56,176,248,.15);
      --red:#f87171;--green:#34d399;--brand-green:#34c47c;--hover:rgba(148,163,184,.08);
    }
    [data-theme="light"]{
      color-scheme:light;
      --bg:#f3f6fb;--card:#ffffff;--field:#ffffff;--border:#a3b1c6;--divider:#e2e8f0;
      --text:#0f172a;--muted:#56657d;--accent:#0a74c2;--on-accent:#ffffff;--accent-soft:#e0f0fc;
      --red:#dc2626;--green:#047857;--brand-green:#16a35a;--hover:rgba(15,23,42,.05);
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:radial-gradient(900px 500px at 90% -10%,var(--accent-soft),transparent 60%),var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;}
    .auth-card{width:100%;max-width:1040px;background:var(--card);border:1px solid var(--divider);box-shadow:0 20px 50px rgba(0,0,0,.18);border-radius:28px;padding:36px;display:grid;grid-template-columns:1fr 1fr;gap:32px;}
    @media(max-width:840px){.auth-card{grid-template-columns:1fr;max-width:460px;padding:28px 24px;gap:20px;}}
    .logo{width:64px;height:64px;object-fit:contain;margin-bottom:18px;display:block;}
    .app-name{font-family:'Plus Jakarta Sans','Inter',sans-serif;font-size:15px;font-weight:800;letter-spacing:-.2px;margin-bottom:22px;}
    .app-name span{background:linear-gradient(90deg,var(--accent),var(--brand-green));-webkit-background-clip:text;background-clip:text;color:transparent;}
    .auth-head h1{font-family:'Plus Jakarta Sans','Inter',sans-serif;font-size:36px;font-weight:800;letter-spacing:-.8px;line-height:1.15;margin-bottom:12px;}
    @media(max-width:840px){.auth-head h1{font-size:28px;}}
    .auth-head p{font-size:16px;color:var(--text);}
    .auth-head .muted{color:var(--muted);font-size:14px;margin-top:6px;}
    .auth-body{display:flex;flex-direction:column;justify-content:center;}
    .field{position:relative;margin-bottom:18px;}
    .field input{width:100%;height:56px;padding:16px 16px 0;background:var(--field);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:16px;font-family:inherit;outline:none;transition:border-color .15s;}
    .field input:focus{border:2px solid var(--accent);padding-left:15px;}
    .field label{position:absolute;left:16px;top:18px;font-size:16px;color:var(--muted);pointer-events:none;transition:all .15s;background:var(--field);padding:0 4px;margin-left:-4px;}
    .field input:focus + label,.field input:not(:placeholder-shown) + label{top:-8px;font-size:12px;}
    .field input:focus + label{color:var(--accent);}
    .actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:28px;flex-wrap:wrap;}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 24px;border-radius:99px;font-size:14px;font-weight:600;cursor:pointer;border:none;font-family:inherit;text-decoration:none;transition:background .15s,box-shadow .15s;}
    .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
    .btn:disabled{opacity:.5;cursor:not-allowed;}
    .btn-primary{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,var(--brand-green)));color:var(--on-accent);}
    .btn-primary:hover:not(:disabled){box-shadow:0 1px 3px rgba(0,0,0,.3);}
    .btn-text{background:transparent;color:var(--accent);padding:0 12px;}
    .btn-text:hover{background:var(--accent-soft);}
    .btn-outline{background:transparent;color:var(--text);border:1px solid var(--border);width:100%;}
    .btn-outline:hover{background:var(--hover);}
    .link{color:var(--accent);font-size:14px;font-weight:500;text-decoration:none;}
    .link:hover{text-decoration:underline;}
    .divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin:22px 0;}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--divider);}
    .alert{display:none;align-items:flex-start;gap:8px;color:var(--red);font-size:14px;margin-bottom:18px;line-height:1.4;}
    .alert.show,.alert.static{display:flex;}
    .alert svg{flex-shrink:0;margin-top:1px;}
    .footer{width:100%;max-width:1040px;display:flex;justify-content:space-between;align-items:center;padding:16px 8px;font-size:12px;color:var(--muted);}
    @media(max-width:840px){.footer{max-width:460px;}}
    .theme-btn{width:36px;height:36px;border-radius:50%;border:none;background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;}
    .theme-btn:hover{background:var(--hover);color:var(--text);}
    .theme-btn svg{width:18px;height:18px;}
    {% block extra_css %}{% endblock %}
  </style>
</head>
<body>
  <main class="auth-card">
    <div class="auth-head">
      <img class="logo" src="{{ url_for('static', filename='logo.png') }}" alt="Reformmed logo">
      <div class="app-name">Reformmed <span>INFRA</span> Monitor</div>
      {% block head %}{% endblock %}
    </div>
    <div class="auth-body">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert static" role="alert">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            <span>{{ message }}</span>
          </div>
        {% endfor %}
      {% endwith %}
      {% block body %}{% endblock %}
    </div>
  </main>
  <div class="footer">
    <span>Reformmed INFRA Monitor</span>
    <button class="theme-btn" id="themeBtn" type="button" onclick="toggleTheme()" title="Switch light / dark theme" aria-label="Switch light or dark theme"></button>
  </div>
  <script>
    var _sun  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
    var _moon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>';
    function applyTheme(t){
      document.documentElement.setAttribute('data-theme', t);
      document.getElementById('themeBtn').innerHTML = t === 'dark' ? _sun : _moon;
    }
    function toggleTheme(){
      var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem('rmTheme', t); } catch(e) {}
      applyTheme(t);
    }
    applyTheme(document.documentElement.getAttribute('data-theme'));
    var CSRF_TOKEN = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
