{% extends "_auth_base.html" %}
{% block title %}2-Step Verification — Reformmed INFRA Monitor{% endblock %}

{% block head %}
  <h1>2-Step Verification</h1>
  <p>Signing in as <strong>{{ username }}</strong></p>
  <p class="muted">Enter the 6-digit code from your authenticator app.</p>
{% endblock %}

{% block body %}
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <input type="text" id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
             placeholder=" " autocomplete="one-time-code" required autofocus>
      <label for="code">Enter code</label>
    </div>
    <div class="actions">
      <a href="{{ url_for('auth.login') }}" class="btn btn-text">Back</a>
      <button type="submit" class="btn btn-primary">Next</button>
    </div>
  </form>
{% endblock %}
